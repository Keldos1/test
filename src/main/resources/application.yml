app:
  name: My Spring Application
  version: 1.0.0
  author: Keldos
spring:
  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp
  datasource:
    url: jdbc:postgresql://localhost:5432/postgres
    username: postgres
    password: 1212
    driver-class-name: org.postgresql.Driver
  jpa:
    properties.hibernat:
      show_sql: true
      format_sql: true
      ddl_auto: validate
server:
  port: 8082